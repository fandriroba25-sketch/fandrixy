<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackHP Pro - Pelacakan Akurat 99%</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SIM INDICATOR -->
    <div class="sim-indicator" id="simIndicator"></div>
    
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <h1>TrackHP <span class="pro">PRO</span></h1>
            <p class="subtitle">Pelacakan akurat 99% • Real-time GPS</p>
        </div>

        <!-- DETECTED SIM -->
        <div id="detectedNumber" class="detected-info">
            <div class="detect-left">
                <i class="fas fa-sim-card-plus"></i>
                <span>Deteksi SIM: <strong id="autoNumber">--</strong></span>
            </div>
            <button onclick="useDetectedNumber()" class="use-btn">
                <i class="fas fa-magic"></i> Gunakan
            </button>
        </div>

        <!-- TRACKING FORM -->
        <div class="tracking-form">
            <div class="input-group large">
                <i class="fas fa-phone"></i>
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    placeholder="📱 +62xxxxxxxxxx"
                    maxlength="15"
                    inputmode="tel"
                >
                <button class="clear-btn" id="clearBtn" onclick="clearInput()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- IMEI INPUT -->
            <div class="input-group">
                <i class="fas fa-fingerprint"></i>
                <input 
                    type="text" 
                    id="imeiInput" 
                    placeholder="IMEI (opsional)"
                    maxlength="15"
                >
            </div>

            <button class="track-btn primary" onclick="startUltimateTracking()">
                <span id="btnText">🚀 Lacak Sekarang</span>
                <span id="loadingText" class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Scanning...
                </span>
            </button>
        </div>

        <!-- TRACKING RESULT -->
        <div id="trackingResult" class="tracking-result"></div>

        <!-- STATUS BARS -->
        <div class="status-bars">
            <div class="status-item">
                <div class="status-icon gps"></div>
                <span>GPS</span>
            </div>
            <div class="status-item">
                <div class="status-icon wifi"></div>
                <span>WiFi</span>
            </div>
            <div class="status-item">
                <div class="status-icon signal"></div>
                <span>Signal</span>
            </div>
        </div>

        <!-- DISCLAIMER -->
        <div class="disclaimer">
            <strong>Legal:</strong> Hanya untuk nomor sah • GPS harus aktif
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
